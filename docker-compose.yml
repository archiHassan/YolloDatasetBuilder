version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yollo-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount data directory for persistence
      - ./data:/app/data
      # Mount models directory for AI models
      - ./models:/app/models
      # Mount logs directory
      - ./logs:/app/logs
    environment:
      # Application settings
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=INFO

      # Server settings
      - HOST=0.0.0.0
      - PORT=8000

      # Database
      - DATABASE_URL=/app/data/annotations.db

      # CORS
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://frontend:80

      # SAM settings
      - SAM_MODE=mock
      - SAM_MODEL_PATH=/app/models/sam_vit_h_4b8939.pth

      # File storage
      - IMAGES_DIR=/app/data/images
      - EXPORT_DIR=/app/data/exports
      - BACKUP_DIR=/app/data/backups

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - yollo-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yollo-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://backend:8000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - yollo-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: yollo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - yollo-network

networks:
  yollo-network:
    driver: bridge

volumes:
  # Named volumes for data persistence
  data:
    driver: local
  models:
    driver: local
  logs:
    driver: local
